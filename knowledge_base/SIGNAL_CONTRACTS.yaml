      dim1: 400
      rows_per_frame: 256
      frames_per_file: 1440
    accepted_dtypes: [float64, double]
    optional_presence: true
    verification_evidence: []
    dtype: double
    reshape_order: frames_stacked_rows
    frame_axis:
      kind: stacked_row_blocks
      frames_per_file: 1440
      height_bins: 256
      rows_per_frame: 256
      index_base: 1
      verification_status: unresolved
    range_axis:
      bins: 256
      verification_status: unresolved
    frequency_axis:
      bins: 400
      verification_status: unresolved
    time_axis:
      mapping: unknown_until_verified
      verification_status: unresolved
    units:
      phase: unverified
    calibration_status: unavailable
    verification_status: unresolved
    source_reference:
      - config/instrument_profiles/kfu_cyclone_2013_2014.yaml
    limitations:
      - "Numeric range, wrapping, and physical meaning are not verified for this profile."
      - "Do not use for automatic scientific decisions until verified."
      - "Phase unwrapping validity is unknown."
    allowed_scientific_uses:
      - inventory_presence_only
      - expert_manual_inspection_with_warning
    prohibited_scientific_claims:
      - polarimetric_OX_separation
      - absolute_phase_physics
      - automatic_phase_derived_morphology
    ui_message_en: "Phase data are available, but their scientific interpretation is not verified for this profile."
    ui_message_ru: "Фазовые данные доступны, но их научная интерпретация для этого профиля не подтверждена."
    automatic_rules_enabled: false

  - contract_id: kfu_ff_v1
    profile_id: kfu_cyclone_2013_2014
    variable_name: ff
    variable_role: frequency_vector
    expected_shape: [400]
    accepted_shapes:
      - [400]
      - [1, 400]
      - [400, 1]
    shape_constraints:
      axis_length: 400
      note: "Row or column vector of length 400 is accepted."
    accepted_dtypes: [float64, double]
    optional_presence: true
    verification_evidence:
      - "Profile frequency_bins=400; ff preferred when present"
    dtype: double
    reshape_order: none
    frame_axis: null
    range_axis: null
    frequency_axis:
      bins: 400
      unit: MHz
      verification_status: provisionally_verified
    time_axis: null
    units:
      frequency: MHz
    calibration_status: provisionally_verified
    verification_status: provisionally_verified
    source_reference:
      - CALSTAT
      - config/instrument_profiles/kfu_cyclone_2013_2014.yaml
    limitations:
      - "May be absent; profile start/step/end used as fallback."
    allowed_scientific_uses:
      - frequency_axis_labeling
      - bin_to_mhz_conversion_when_present
    prohibited_scientific_claims:
      - metrologically_confirmed_frequency_scale

