# Machine-readable MAT signal contracts — Phase 4A / 4A.1
# Status vocabulary: verified | provisionally_verified | source_supported |
#                    project_heuristic | unavailable | unresolved | disabled
#
# Schema (Phase 4A.1): do NOT mix notes and numeric shapes in the same list.
# Use: accepted_shapes | shape_constraints | accepted_dtypes | optional_presence |
#      verification_evidence
version: "1.1.1"
profile_id: kfu_cyclone_2013_2014
schema_version: "4A.1"

contracts:
  - contract_id: kfu_amp_all_v1
    profile_id: kfu_cyclone_2013_2014
    variable_name: Amp_all
    variable_role: primary_amplitude
    expected_shape: [368640, 400]
    accepted_shapes:
      - [368640, 400]
    shape_constraints:
      ndim: 2
      dim0_multiple_of: 256
      dim1: 400
      rows_per_frame: 256
      frames_per_file: 1440
      note: "Synthetic/test stacks may use N*256 x 400 with N < 1440; full-day archive is 1440 frames."
    accepted_dtypes: [uint16, float64, double]
    optional_presence: false
    verification_evidence:
      - "Am_all_2013-01-01.mat shape (368640, 400) dtype uint16; frames 1/421/1440 via extract_frame_consistent"
      - "workspaces/_phase4a_evidence/ (Phase 4A.1 bundle)"
    dtype: uint16_or_double
    reshape_order: frames_stacked_rows
    frame_axis:
      kind: stacked_row_blocks
      frames_per_file: 1440
      height_bins: 256
      rows_per_frame: 256
      index_base: 1
      row_start_formula: "(frame_index - 1) * 256"
      row_end_formula: "frame_index * 256"   # exclusive end in Python slice
      verification_status: provisionally_verified
    range_axis:
      bins: 256
      meaning: nominal_virtual_height_bins
      unit: km
      scale_km_per_bin: 2.5
      verification_status: provisionally_verified
      note: "Nominal virtual height proxy — not true height"
    frequency_axis:
      bins: 400
      unit: MHz
      start_mhz: 1.5
      step_mhz: 0.019
      end_mhz: 9.081
      source_variable: ff
      verification_status: provisionally_verified
      note: "When ff is absent, profile start/step/end are used as provisional axis"
    time_axis:
      mapping: matlab_index_minus_1_minute
      unit: minute_of_day
      frame_1_minute: 0
      frame_1440_minute: 1439
      verification_status: provisionally_verified
    units:
      amplitude: uncalibrated_archive_units
    calibration_status: unavailable
    verification_status: provisionally_verified
    source_reference:
      - CALSTAT
      - GETION
      - config/instrument_profiles/kfu_cyclone_2013_2014.yaml
    limitations:
      - "Image PNG is a visualization of this matrix, not a scientific replacement."
      - "Absolute MHz/km metrology and clock confirmation remain Gate2-open."
      - "Do not treat pixel intensity as calibrated foF2."
    allowed_scientific_uses:
      - morphology_candidate_features
      - teaching_visualization
      - comparative_diagnostics
    prohibited_scientific_claims:
      - calibrated_critical_frequency
      - true_height_profile
      - confirmed_OX_mode_assignment

  - contract_id: kfu_phs_all_v1
    profile_id: kfu_cyclone_2013_2014
    variable_name: Phs_all
    variable_role: phase_or_unknown_companion
