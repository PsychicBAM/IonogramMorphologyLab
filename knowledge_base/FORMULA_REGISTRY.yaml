  - formula_id: F004
    scientific_concept: midlatitude_spread_f_observational_definition
    classification: morphology_definition
    exact_source_id: A3L018
    book_or_article_title: "F-рассеяние в среднеширотной ионосфере по данным DPS-4"
    exact_page_or_equation: "printed p.241; PDF p.2; §1 Введение"
    source_location:
      printed_page: 241
      pdf_page: 2
      section: "1. ВВЕДЕНИЕ"
      figure: null
      table: null
      equation: null
    expression_kind: translated_quotation
    original_expression: >-
      Термин F-рассеяние служит для описания результатов вертикального зондирования
      ионосферы в случаях, когда сигнал, отраженный ионосферой, теряет свою первоначальную
      структуру, становится диффузным по дистанции и наблюдаются отражения на частотах,
      превышающих критические.
    original_expression_en: >-
      The term F-spread describes vertical-sounding results when the ionosphere-reflected
      signal loses its original structure, becomes range-diffuse, and echoes are observed
      at frequencies exceeding the critical frequencies.
    normalized_machine_expression: null
    variable_definitions:
      SF: spread-F observational class
      f_c: critical frequency context
    units: observational
    input_signal_contract: kfu_amp_all_v1
    domain_of_applicability: midlatitude_vertical_sounding
    instrument_assumptions: DPS-4 / midlatitude observational
    geographic_regime_assumptions: midlatitude_not_equatorial
    required_preprocessing: visual_or_feature_evidence
    uncertainty: "Not a causal physical law; broad article page range 241–249 is NOT used as the citation"
    exclusions: "Do not present as an exact numeric equation"
    implementation_status: morphology_definition_only
    python_implementation: null
    matlab_implementation: null
