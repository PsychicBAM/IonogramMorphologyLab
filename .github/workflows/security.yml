name: Security checks

on: [push, pull_request, workflow_dispatch]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]" pip-audit

      - name: Unsafe API grep (fail on match)
        run: |
          if rg -n 'shell\s*=\s*True|yaml\.load\(|pickle\.' src scripts; then
            echo "::error::Unsafe API pattern detected"
            exit 1
          fi
          echo "Unsafe API grep: clean"

      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Bandit (High/Critical fail the job)
        run: |
          # Installation failures fail the previous step (no || true).
          # Exit codes: 0 = clean under -ll, non-zero = High/Critical findings or crash.
          python -m bandit -r src -x tests -ll -iii -f txt -o bandit-report.txt
          echo "Bandit completed with no High/Critical findings."

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore

      - name: pip-audit
        id: pip_audit
        run: |
          python -m pip_audit -r requirements/requirements-base.txt -f json -o pip-audit.json
          python -m pip_audit -r requirements/requirements-base.txt -f columns -o pip-audit.txt
          echo "pip-audit: no known vulnerabilities reported for pinned requirements."

      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: |
            pip-audit.json
            pip-audit.txt
          if-no-files-found: warn

      # Informational only: do not exit 1 (preserves the original failing step as the job cause).
      - name: Security job failure summary
        if: failure()
        run: |
          echo "A security job step failed. Inspect the first red step above for the original error."
          echo "- Bandit: High/Critical findings or Bandit crash after install."
          echo "- Install security tools: Bandit/pip-audit installation failed."
          echo "- Repository hygiene / Unsafe API grep: repository policy violation."
          echo "- pip-audit: known vulnerabilities or tool failure (see artifacts)."
