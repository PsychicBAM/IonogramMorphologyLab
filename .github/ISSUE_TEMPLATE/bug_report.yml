name: Bug report
description: Report a reproducible software problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes: {value: "Do not attach private ionograms, credentials, or restricted data."}
  - type: input
    id: version
    attributes: {label: Version, placeholder: "1.1.1"}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce, description: "Use synthetic/minimal non-sensitive data."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected and actual behavior}
    validations: {required: true}
